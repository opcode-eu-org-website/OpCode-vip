name: Build and deploy to Pages

on:
  push:
    branches: [ master, dev ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Chromium
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 138
        id: setup-chrome

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git
          sudo TMPDIR=${{ runner.temp }} make installDependencies
          
          # `apt install chromium` on Ubuntu doesn't actually install chromium ...
          # so we use `setup-chrome` step and create simple run script here:
          echo 'exec ${{ steps.setup-chrome.outputs.chrome-path }} --no-sandbox "$@"' > /usr/local/bin/chromium
          chmod +x /usr/local/bin/chromium

      - name: Run build script via Make
        run: |
          export TMPDIR=${{ runner.temp }}
          make all
          (cd output-www; ln -sf vademecum.xhtml index.xhtml)
          cp OpCode-core/lib/404.html output-www

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output-www'

  deploy-github:
    # https://opcode-eu-org-website.github.io/opcode-vip
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    # https://vip-opcode.pages.dev/
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download GitHub Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./tmp-artifact

      - name: Unpack Pages artifact
        run: |
          mkdir dist
          ls -l ./tmp-artifact
          tar -xvf ./tmp-artifact/*.tar -C dist
          echo "/ /index.xhtml 200" >> dist/_redirects
          ls -l ./dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=vip-opcode
